[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-recommendation-engine"
version = "0.1.0"
description = "A deterministic, explainable venue recommendation API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.10,<3.0",
  "pypdf>=6.0,<7.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
]
ml = [
    "scikit-learn>=1.9,<2.0",
]
rag = [
    "fastembed>=0.7,<1.0",
    # Ragas 0.4.3 still imports the legacy VertexAI module removed in 0.4.2.
    "langchain-community>=0.4,<0.4.2",
    "ragas>=0.4,<0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "ragas.*"
ignore_missing_imports = true
